name: Generate Contribution Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: NehaamKhan

          outputs: |
            output/puzzle-bobble-contribution-graph.svg?palette=github-light&game=puzzle-bobble
            output/puzzle-bobble-contribution-graph-dark.svg?palette=github-dark&game=puzzle-bobble

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
